<style>
  :root {
    --navy: #1F3A68;
    --teal: #0E7C7B;
    --gray-bg: #F2F2F2;
    --border: #D9DDE3;
    --text: #222;
    --danger: #C0392B;
    --ok: #1E7B34;
    --dcm: #D8272C;
    --sbym: #6E6E73;
    --auuq: #F39A1F;
    font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #F6F7F9; color: var(--text);
    max-width: 100%; overflow-x: hidden;
  }
  body { padding: 12px; }
  .num { font-variant-numeric: tabular-nums; text-align: right; font-weight: bold; }
  input[type="number"] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 3px;
    font-variant-numeric: tabular-nums; text-align: right; font-weight: bold; font-size: 14px;
  }
  input[type="date"], select, textarea, input[type="text"] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 3px; font-size: 14px;
    font-family: inherit;
  }
  input[readonly] { background: var(--gray-bg); color: #555; }
  label.field-label { display: block; font-size: 11px; color: #555; margin-bottom: 2px; }
  .field { margin-bottom: 6px; }

  .app { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 1200px; margin: 0 auto; }
  @media (min-width: 900px) {
    .app { grid-template-columns: 1fr 320px; align-items: start; }
  }

  .card { background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-bottom: 12px; }
  .header-card .top-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 600px) {
    .header-card .top-row { grid-template-columns: repeat(3, 1fr); }
  }

  .badge { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 12px; font-weight: bold; }
  .badge-loaded { background: #FFF3CD; color: #7A5B00; }

  .tabbar { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 10px; overflow-x: auto; }
  .tab-btn {
    flex: 0 0 auto; padding: 10px 14px; border: none; background: none; cursor: pointer;
    font-size: 14px; font-weight: bold; color: #666; border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .group-band {
    color: #fff; font-weight: bold; padding: 6px 10px; border-radius: 3px 3px 0 0; margin-top: 14px; font-size: 13px;
  }
  .group-band:first-child { margin-top: 0; }
  .carrier-card { border: 1px solid var(--border); border-radius: 0 0 3px 3px; padding: 10px; margin-bottom: 10px; }
  .carrier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 600px) {
    .carrier-grid { grid-template-columns: repeat(5, 1fr); }
  }

  .category-title { font-size: 12px; font-weight: bold; color: #444; margin: 10px 0 6px; }
  .sub-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 700px) {
    .sub-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .mig-src-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 600px) {
    .mig-src-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .yagou-row { border: 1px solid var(--border); border-radius: 3px; padding: 10px; margin-bottom: 10px; }
  .yagou-row-title { font-weight: bold; margin-bottom: 8px; font-size: 13px; }
  .yagou-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 600px) {
    .yagou-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .btn {
    padding: 9px 14px; border-radius: 3px; border: 1px solid var(--navy); background: var(--navy); color: #fff;
    font-weight: bold; font-size: 14px; cursor: pointer;
  }
  .btn.secondary { background: #fff; color: var(--navy); }
  .btn.teal { background: var(--teal); border-color: var(--teal); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  .msg { margin-top: 8px; padding: 8px 10px; border-radius: 3px; font-size: 13px; display: none; }
  .msg.ok { display: block; background: #E7F5EA; color: var(--ok); border: 1px solid #BEE3C6; }
  .msg.error { display: block; background: #FBE9E7; color: var(--danger); border: 1px solid #F1C4BE; white-space: pre-wrap; }

  .sidebar h3 { font-size: 13px; color: var(--navy); margin: 0 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .share-block { margin-bottom: 14px; }
  .share-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
  .share-bar { display: flex; height: 12px; border-radius: 2px; overflow: hidden; background: #eee; margin-bottom: 4px; }
  .share-seg { height: 100%; }
  .share-legend { font-size: 11px; color: #444; display: flex; flex-wrap: wrap; gap: 8px; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  .mini-row { font-size: 12px; color: #333; margin-bottom: 4px; }
  .src-check { font-size: 12px; font-weight: bold; margin-top: 4px; }
  .src-check.ok { color: var(--ok); }
  .src-check.bad { color: var(--danger); }
  .week-share-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }

  select#sheetChoice { width: auto; display: inline-block; }
</style>

<div class="app">
  <div class="main">

    <div class="card header-card">
      <div class="top-row">
        <div class="field">
          <label class="field-label">日付</label>
          <input type="date" id="date" value="<?= todayStr ?>">
        </div>
        <div class="field">
          <label class="field-label">イベント</label>
          <select id="event">
            <option>なし</option>
            <option>ドコモイベント</option>
            <option>auイベント</option>
            <option>SBイベント</option>
            <option>au・SBイベント</option>
            <option>その他</option>
          </select>
          <input type="text" id="eventOther" placeholder="イベント名を入力" style="display:none; margin-top:6px;">
        </div>
        <div class="field">
          <label class="field-label">メモ</label>
          <textarea id="memo" rows="1"></textarea>
        </div>
      </div>
      <div id="loadedBadge" style="display:none; margin-top:8px;">
        <span class="badge badge-loaded">入力済み → 上書き保存になります</span>
      </div>
      <div id="msg" class="msg"></div>
    </div>

    <div class="card">
      <div class="tabbar">
        <button class="tab-btn active" data-tab="tab1">① MB総販・MNP</button>
        <button class="tab-btn" data-tab="tab2">② 副商材</button>
        <button class="tab-btn" data-tab="tab3">③ 屋号商材</button>
      </div>

      <div id="tab1" class="tab-panel active"></div>
      <div id="tab2" class="tab-panel"></div>
      <div id="tab3" class="tab-panel"></div>

      <div class="btn-row">
        <button class="btn" id="btnSave">保存</button>
        <button class="btn secondary" id="btnClear">クリア</button>
      </div>
    </div>

    <div class="card">
      <div class="btn-row">
        <button class="btn secondary" id="btnCopyWeek">今週の報告テキストをコピー</button>
        <button class="btn secondary" id="btnCopyMonth">今月の報告テキストをコピー</button>
        <button class="btn secondary" id="btnCsv">この月をCSVで書き出す</button>
        <button class="btn secondary" id="btnMail">報告をメール送信</button>
      </div>
      <div class="btn-row">
        <select id="sheetChoice">
          <option value="summary">日次サマリー</option>
          <option value="weekly">週次集計</option>
          <option value="monthly">月次集計</option>
          <option value="settings">設定</option>
        </select>
        <button class="btn secondary" id="btnOpenSheet">集計シートを開く</button>
      </div>
    </div>

  </div>

  <div class="sidebar">
    <div class="card">
      <h3>自動計算（現在の入力）</h3>
      <div id="liveShare"></div>
    </div>
  </div>
</div>

<script>
  var DEFS = <?!= defsJson ?>;
  var TODAY = '<?= todayStr ?>';

  var GROUPS = DEFS.GROUPS;
  var GROUP_LABEL = DEFS.GROUP_LABEL;
  var GROUP_COLOR = DEFS.GROUP_COLOR;
  var CARRIER_GROUP = DEFS.CARRIER_GROUP;

  function clamp(v) {
    var n = Number(v);
    if (v === '' || v === null || v === undefined || isNaN(n)) return 0;
    n = Math.floor(n);
    return n < 0 ? 0 : n;
  }
  function getVal(id) {
    var e = document.getElementById(id);
    return e ? clamp(e.value) : 0;
  }
  function setNum(id, v) {
    var e = document.getElementById(id);
    if (!e) return;
    e.value = (v === 0 || v === '' || v === null || v === undefined) ? '' : v;
  }
  function sumObj(o) { return Object.keys(o).reduce(function (a, k) { return a + o[k]; }, 0); }
  function fmtPct(p) { return p.toFixed(1) + '%'; }

  // ============================================================
  // タブ切り替え
  // ============================================================
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ============================================================
  // ① MB総販・MNP タブの組み立て
  // ============================================================
  function buildTab1() {
    var root = document.getElementById('tab1');
    var html = '';

    DEFS.CARRIERS.forEach(function (c) {
      var g = CARRIER_GROUP[c];
      html += '<div class="group-band" style="background:' + GROUP_COLOR[g] + '">' + c + '（' + GROUP_LABEL[g] + '）</div>';
      html += '<div class="carrier-card"><div class="carrier-grid">';
      html += field('機変', c + '_kihen');
      html += field('純新規', c + '_junshinki');
      html += field('MNP(リク込み)', c + '_mnp');
      html += field('MB総販(自動)', c + '_mb', true);
      html += field('内SIMのみ', c + '_uchiSim');
      html += '</div></div>';
    });

    html += '<div class="category-title">番号移行（同一グループ内の移行＝「リク」）</div>';
    html += '<div class="mig-src-grid">';
    DEFS.MIGRATIONS.forEach(function (m) { html += field(m.text, m.key); });
    html += '</div>';

    html += '<div class="category-title">MNP 移転元キャリア（任意入力）</div>';
    html += '<div class="mig-src-grid">';
    DEFS.SOURCES.forEach(function (s) { html += field(s.text, s.key); });
    html += '</div>';
    html += '<div id="srcCheck" class="src-check"></div>';

    root.innerHTML = html;
  }

  function field(label, id, readonly) {
    return '<div class="field"><label class="field-label">' + label + '</label>' +
      '<input type="number" inputmode="numeric" min="0" id="' + id + '"' + (readonly ? ' readonly' : '') + '></div>';
  }

  // ============================================================
  // ② 副商材タブの組み立て（SUB_DEF から自動生成。項目を増やしても直す必要なし）
  // ============================================================
  function buildTab2() {
    var root = document.getElementById('tab2');
    var html = '';
    GROUPS.forEach(function (g) {
      var defsInGroup = DEFS.SUB_DEF.filter(function (d) { return d.group === g; });
      if (defsInGroup.length === 0) return;
      html += '<div class="group-band" style="background:' + GROUP_COLOR[g] + '">' + GROUP_LABEL[g] + '</div>';
      html += '<div class="carrier-card">';
      var categories = [];
      defsInGroup.forEach(function (d) { if (categories.indexOf(d.category) === -1) categories.push(d.category); });
      categories.forEach(function (cat) {
        html += '<div class="category-title">' + cat + '</div><div class="sub-grid">';
        defsInGroup.filter(function (d) { return d.category === cat; }).forEach(function (d) {
          html += field(d.name, d.key, d.type === 'sum');
        });
        html += '</div>';
      });
      html += '</div>';
    });
    root.innerHTML = html;
  }

  // ============================================================
  // ③ 屋号商材タブの組み立て
  // ============================================================
  function buildTab3() {
    var root = document.getElementById('tab3');
    var html = '';
    DEFS.YAGOU_PRODUCTS.forEach(function (p) {
      html += '<div class="yagou-row"><div class="yagou-row-title">' + p.label + '</div><div class="yagou-grid">';
      DEFS.YAGOU_GROUP_ORDER.forEach(function (g) {
        html += field(GROUP_LABEL[g], 'yagou_' + p.key + '_' + g);
      });
      html += field('計(自動)', 'yagou_total_' + p.key, true);
      html += '</div></div>';
    });
    root.innerHTML = html;
  }

  // ============================================================
  // 入力値の収集・復元
  // ============================================================
  function collectFormData() {
    var raw = {};
    raw.date = document.getElementById('date').value;
    raw.event = getEventValue();
    raw.memo = document.getElementById('memo').value;
    DEFS.CARRIERS.forEach(function (c) {
      ['kihen', 'junshinki', 'mnp', 'uchiSim'].forEach(function (f) {
        raw[c + '_' + f] = getVal(c + '_' + f);
      });
    });
    DEFS.MIGRATIONS.forEach(function (m) { raw[m.key] = getVal(m.key); });
    DEFS.SOURCES.forEach(function (s) { raw[s.key] = getVal(s.key); });
    DEFS.SUB_DEF.forEach(function (d) { if (d.type === 'input') raw[d.key] = getVal(d.key); });
    DEFS.YAGOU_PRODUCTS.forEach(function (p) {
      DEFS.YAGOU_GROUP_ORDER.forEach(function (g) { raw['yagou_' + p.key + '_' + g] = getVal('yagou_' + p.key + '_' + g); });
    });
    return raw;
  }

  function fillForm(raw) {
    document.getElementById('memo').value = raw.memo || '';
    setEventValue(raw.event || '');
    DEFS.CARRIERS.forEach(function (c) {
      ['kihen', 'junshinki', 'mnp', 'uchiSim'].forEach(function (f) {
        setNum(c + '_' + f, clamp(raw[c + '_' + f]));
      });
    });
    DEFS.MIGRATIONS.forEach(function (m) { setNum(m.key, clamp(raw[m.key])); });
    DEFS.SOURCES.forEach(function (s) { setNum(s.key, clamp(raw[s.key])); });
    DEFS.SUB_DEF.forEach(function (d) { if (d.type === 'input') setNum(d.key, clamp(raw[d.key])); });
    DEFS.YAGOU_PRODUCTS.forEach(function (p) {
      DEFS.YAGOU_GROUP_ORDER.forEach(function (g) {
        var key = 'yagou_' + p.key + '_' + g;
        setNum(key, clamp(raw[key]));
      });
    });
  }

  function resetFormNumbers() {
    document.getElementById('memo').value = '';
    setEventValue('');
    DEFS.CARRIERS.forEach(function (c) {
      ['kihen', 'junshinki', 'mnp', 'uchiSim', 'mb'].forEach(function (f) { setNum(c + '_' + f, 0); });
    });
    DEFS.MIGRATIONS.forEach(function (m) { setNum(m.key, 0); });
    DEFS.SOURCES.forEach(function (s) { setNum(s.key, 0); });
    DEFS.SUB_DEF.forEach(function (d) { setNum(d.key, 0); });
    DEFS.YAGOU_PRODUCTS.forEach(function (p) {
      DEFS.YAGOU_GROUP_ORDER.forEach(function (g) { setNum('yagou_' + p.key + '_' + g, 0); });
      setNum('yagou_total_' + p.key, 0);
    });
  }

  function getEventValue() {
    var sel = document.getElementById('event');
    if (sel.value === 'なし') return '';
    if (sel.value === 'その他') return document.getElementById('eventOther').value.trim();
    return sel.value;
  }
  function setEventValue(v) {
    var sel = document.getElementById('event');
    var other = document.getElementById('eventOther');
    var known = ['ドコモイベント', 'auイベント', 'SBイベント', 'au・SBイベント'];
    if (!v) { sel.value = 'なし'; other.style.display = 'none'; other.value = ''; return; }
    if (known.indexOf(v) !== -1) { sel.value = v; other.style.display = 'none'; other.value = ''; return; }
    sel.value = 'その他'; other.style.display = 'block'; other.value = v;
  }
  document.getElementById('event').addEventListener('change', function () {
    document.getElementById('eventOther').style.display = (this.value === 'その他') ? 'block' : 'none';
  });

  // ============================================================
  // リアルタイム自動計算（サーバー側 logic.js と同じ計算式を再現）
  // ============================================================
  function recalc() {
    var mbByGroup = { DCM: 0, SBYM: 0, AUUQ: 0 };
    DEFS.CARRIERS.forEach(function (c) {
      var mb = getVal(c + '_kihen') + getVal(c + '_junshinki') + getVal(c + '_mnp');
      setNum(c + '_mb', mb);
      mbByGroup[CARRIER_GROUP[c]] += mb;
    });

    var rikuKomiByGroup = { DCM: 0, SBYM: 0, AUUQ: 0 };
    var uchiSimByGroup = { DCM: 0, SBYM: 0, AUUQ: 0 };
    DEFS.CARRIERS.forEach(function (c) {
      var g = CARRIER_GROUP[c];
      rikuKomiByGroup[g] += getVal(c + '_mnp');
      uchiSimByGroup[g] += getVal(c + '_uchiSim');
    });
    var migTotalByGroup = { DCM: 0, SBYM: 0, AUUQ: 0 };
    DEFS.MIGRATIONS.forEach(function (m) { migTotalByGroup[m.group] += getVal(m.key); });
    var rikuNukiByGroup = {};
    GROUPS.forEach(function (g) {
      rikuNukiByGroup[g] = g === 'DCM' ? rikuKomiByGroup.DCM : rikuKomiByGroup[g] - migTotalByGroup[g];
    });
    var migTotal = sumObj(migTotalByGroup);
    var uchiSimTotal = sumObj(uchiSimByGroup);

    var sourceTotal = 0;
    DEFS.SOURCES.forEach(function (s) { sourceTotal += getVal(s.key); });
    var mnpTotalAll = sumObj(rikuKomiByGroup);
    renderSrcCheck(sourceTotal, mnpTotalAll);

    // 副商材（sum型は of を再帰解決）
    var subDefByKey = {};
    DEFS.SUB_DEF.forEach(function (d) { subDefByKey[d.key] = d; });
    var resolved = {};
    function resolveSub(key) {
      if (resolved.hasOwnProperty(key)) return resolved[key];
      var d = subDefByKey[key];
      var v;
      if (!d) v = 0;
      else if (d.type === 'input') v = getVal(key);
      else v = d.of.reduce(function (acc, k) { return acc + resolveSub(k); }, 0);
      resolved[key] = v;
      return v;
    }
    DEFS.SUB_DEF.forEach(function (d) {
      resolveSub(d.key);
      if (d.type === 'sum') setNum(d.key, resolved[d.key]);
    });
    var subGrandTotal = 0;
    DEFS.SUB_DEF.forEach(function (d) { if (d.type === 'input') subGrandTotal += resolved[d.key]; });

    // 屋号商材
    var yagouGrandTotal = 0;
    DEFS.YAGOU_PRODUCTS.forEach(function (p) {
      var t = 0;
      DEFS.YAGOU_GROUP_ORDER.forEach(function (g) { t += getVal('yagou_' + p.key + '_' + g); });
      setNum('yagou_total_' + p.key, t);
      yagouGrandTotal += t;
    });

    function share(byGroup) {
      var total = sumObj(byGroup);
      var res = { total: total, byGroup: {} };
      GROUPS.forEach(function (g) {
        var count = byGroup[g] || 0;
        res.byGroup[g] = { count: count, pct: total > 0 ? (count / total) * 100 : 0 };
      });
      return res;
    }

    renderLiveShare({
      mbShare: share(mbByGroup),
      rikuKomiShare: share(rikuKomiByGroup),
      rikuNukiShare: share(rikuNukiByGroup),
      uchiSimTotal: uchiSimTotal,
      migTotal: migTotal,
      subGrandTotal: subGrandTotal,
      yagouGrandTotal: yagouGrandTotal
    });
  }

  function renderSrcCheck(sourceTotal, mnpTotal) {
    var elDiv = document.getElementById('srcCheck');
    if (!elDiv) return;
    if (sourceTotal === 0) { elDiv.textContent = ''; elDiv.className = 'src-check'; return; }
    if (sourceTotal === mnpTotal) {
      elDiv.textContent = '移転元の合計はMNPリク込みと一致しています（' + sourceTotal + '件）';
      elDiv.className = 'src-check ok';
    } else {
      elDiv.textContent = '移転元の合計(' + sourceTotal + '件)がMNPリク込み(' + mnpTotal + '件)と一致しません（差:' + (mnpTotal - sourceTotal) + '件）';
      elDiv.className = 'src-check bad';
    }
  }

  function shareBarHtml(title, share) {
    if (share.total === 0) return '';
    var html = '<div class="share-block"><div class="share-title">' + title + '（計' + share.total + '件）</div>';
    html += '<div class="share-bar">';
    GROUPS.forEach(function (g) {
      var pct = share.byGroup[g].pct;
      if (pct > 0) html += '<div class="share-seg" style="width:' + pct + '%; background:' + GROUP_COLOR[g] + '"></div>';
    });
    html += '</div><div class="share-legend">';
    GROUPS.forEach(function (g) {
      html += '<span><span class="legend-dot" style="background:' + GROUP_COLOR[g] + '"></span>' +
        GROUP_LABEL[g] + ' ' + share.byGroup[g].count + '件(' + fmtPct(share.byGroup[g].pct) + ')</span>';
    });
    html += '</div></div>';
    return html;
  }

  function renderLiveShare(data) {
    var html = '';
    html += shareBarHtml('MB総販', data.mbShare);
    html += shareBarHtml('MNPリク込み', data.rikuKomiShare);
    html += shareBarHtml('MNPリク除き', data.rikuNukiShare);
    if (data.uchiSimTotal > 0) html += '<div class="mini-row">内SIMのみ：計' + data.uchiSimTotal + '件</div>';
    if (data.migTotal > 0) html += '<div class="mini-row">番号移行：計' + data.migTotal + '件</div>';
    if (data.subGrandTotal > 0) html += '<div class="mini-row">副商材計：' + data.subGrandTotal + '件</div>';
    if (data.yagouGrandTotal > 0) html += '<div class="mini-row">屋号商材計：' + data.yagouGrandTotal + '件</div>';
    document.getElementById('liveShare').innerHTML = html || '<div class="mini-row">まだ実績が入力されていません。</div>';
  }

  function renderWeekShareAfterSave(result) {
    var box = document.getElementById('weekShareBox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'weekShareBox';
      box.className = 'week-share-box';
      document.querySelector('.sidebar .card').appendChild(box);
    }
    var html = '<h3 style="margin-top:0;">今週(' + result.weekStart + '〜' + result.weekEnd + ')の実績</h3>';
    html += shareBarHtml('MB総販', result.weekShare.mb);
    html += shareBarHtml('MNPリク込み', result.weekShare.rikuKomi);
    html += shareBarHtml('MNPリク除き', result.weekShare.rikuNuki);
    box.innerHTML = html;
  }

  // ============================================================
  // メッセージ表示
  // ============================================================
  function showMessage(text, kind) {
    var box = document.getElementById('msg');
    box.textContent = text;
    box.className = 'msg ' + (kind === 'error' ? 'error' : 'ok');
  }

  // ============================================================
  // 保存
  // ============================================================
  function setSaving(saving) {
    var btn = document.getElementById('btnSave');
    btn.disabled = saving;
    btn.textContent = saving ? '保存中…' : '保存';
  }

  document.getElementById('btnSave').addEventListener('click', function () {
    var raw = collectFormData();
    if (!raw.date) { showMessage('日付を選択してください。', 'error'); return; }

    var sourceTotal = 0;
    DEFS.SOURCES.forEach(function (s) { sourceTotal += clamp(raw[s.key]); });
    var mnpTotal = 0;
    DEFS.CARRIERS.forEach(function (c) { mnpTotal += clamp(raw[c + '_mnp']); });
    if (sourceTotal > 0 && sourceTotal !== mnpTotal) {
      var proceed = window.confirm(
        '移転元の合計(' + sourceTotal + '件)とMNPリク込みの合計(' + mnpTotal + '件)が一致しません(差:' + (mnpTotal - sourceTotal) + '件)。\nこのまま保存しますか？'
      );
      if (!proceed) return;
    }

    setSaving(true);
    google.script.run
      .withSuccessHandler(function (result) {
        setSaving(false);
        showMessage('保存しました。', 'ok');
        document.getElementById('loadedBadge').style.display = 'block';
        renderWeekShareAfterSave(result);
      })
      .withFailureHandler(function (err) {
        setSaving(false);
        showMessage('保存に失敗しました：' + (err && err.message ? err.message : err), 'error');
      })
      .saveDay(raw);
  });

  document.getElementById('btnClear').addEventListener('click', function () {
    resetFormNumbers();
    recalc();
    document.getElementById('loadedBadge').style.display = 'none';
    showMessage('クリアしました。', 'ok');
  });

  // ============================================================
  // 日付選択 → 既存データの読み込み
  // ============================================================
  document.getElementById('date').addEventListener('change', function () {
    var d = this.value;
    resetFormNumbers();
    document.getElementById('date').value = d;
    loadDateData(d);
  });

  function loadDateData(dateStr) {
    google.script.run
      .withSuccessHandler(function (raw) {
        if (raw) {
          fillForm(raw);
          document.getElementById('loadedBadge').style.display = 'block';
        } else {
          document.getElementById('loadedBadge').style.display = 'none';
        }
        recalc();
      })
      .withFailureHandler(function (err) {
        showMessage('読み込みに失敗しました：' + (err && err.message ? err.message : err), 'error');
      })
      .loadDay(dateStr);
  }

  // ============================================================
  // すぐ出力
  // ============================================================
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { legacyCopy(text); });
    } else {
      legacyCopy(text);
    }
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* noop */ }
    document.body.removeChild(ta);
  }

  function onGenericFail(err) {
    showMessage('処理に失敗しました：' + (err && err.message ? err.message : err), 'error');
  }

  document.getElementById('btnCopyWeek').addEventListener('click', function () {
    var d = document.getElementById('date').value;
    google.script.run.withSuccessHandler(function (text) {
      copyToClipboard(text);
      showMessage('今週の報告テキストをコピーしました。', 'ok');
    }).withFailureHandler(onGenericFail).getWeeklyReportText(d);
  });

  document.getElementById('btnCopyMonth').addEventListener('click', function () {
    var d = document.getElementById('date').value;
    google.script.run.withSuccessHandler(function (text) {
      copyToClipboard(text);
      showMessage('今月の報告テキストをコピーしました。', 'ok');
    }).withFailureHandler(onGenericFail).getMonthlyReportText(d.slice(0, 7));
  });

  document.getElementById('btnCsv').addEventListener('click', function () {
    var d = document.getElementById('date').value;
    google.script.run.withSuccessHandler(function (res) {
      var blob = new Blob([res.content], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = res.filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showMessage('CSVをダウンロードしました。', 'ok');
    }).withFailureHandler(onGenericFail).exportMonthCsv(d.slice(0, 7));
  });

  document.getElementById('btnOpenSheet').addEventListener('click', function () {
    google.script.run.withSuccessHandler(function (links) {
      var key = document.getElementById('sheetChoice').value;
      var url = links[key];
      if (url) window.open(url, '_blank');
    }).withFailureHandler(onGenericFail).getSheetLinks();
  });

  document.getElementById('btnMail').addEventListener('click', function () {
    var d = document.getElementById('date').value;
    google.script.run.withSuccessHandler(function (res) {
      showMessage(res.message, res.ok ? 'ok' : 'error');
    }).withFailureHandler(onGenericFail).sendReportMail(d);
  });

  // ============================================================
  // 初期化
  // ============================================================
  buildTab1();
  buildTab2();
  buildTab3();
  document.addEventListener('input', recalc);
  recalc();
  loadDateData(TODAY);
</script>
